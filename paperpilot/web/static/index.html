<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperPilot Conversations</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>PaperPilot</h1>
        <p>Paper conversation workspace</p>
      </div>
      <div class="auth-panel" aria-label="Authentication">
        <form id="authForm" class="auth-form">
          <input
            id="username"
            name="username"
            autocomplete="username"
            placeholder="Username"
            required
          />
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            minlength="6"
            required
          />
          <button id="loginButton" type="submit">Log In</button>
          <button id="registerButton" type="button" class="secondary-button">Register</button>
        </form>
        <div id="currentUser" class="current-user" hidden>
          <span id="currentUsername"></span>
          <button id="logoutButton" type="button" class="secondary-button">Log Out</button>
        </div>
        <p id="authMessage" class="message" role="status"></p>
      </div>
    </header>

    <div id="workspace" hidden>
      <main id="conversationView" class="conversation-layout">
        <aside class="conversation-sidebar" aria-label="Paper and conversation navigation">
          <section class="panel conversation-paper-panel" aria-labelledby="paperSearchTitle">
            <h2 id="paperSearchTitle">Find a paper</h2>
            <form id="paperSearch">
              <label for="paperQuery">Title, topic, arXiv ID, or URL</label>
              <div class="conversation-inline-form">
                <input
                  id="paperQuery"
                  name="paperQuery"
                  placeholder="retrieval augmented generation"
                  required
                />
                <button type="submit">Search</button>
              </div>
            </form>
            <p id="paperSearchMessage" class="message" role="status"></p>
            <div id="paperCandidates" class="paper-candidates"></div>
          </section>

          <section class="panel conversation-history-panel" aria-labelledby="conversationListTitle">
            <div class="section-heading">
              <h2 id="conversationListTitle">Conversations</h2>
              <button id="refreshConversations" type="button" class="secondary-button">Refresh</button>
            </div>
            <div id="conversationList" class="conversation-list"></div>
          </section>
        </aside>

        <section class="panel conversation-reader" aria-labelledby="conversationTitle">
          <header class="conversation-header">
            <div>
              <h2 id="conversationTitle">Select a conversation</h2>
              <p id="conversationPaper" class="conversation-paper"></p>
            </div>
          </header>

          <p id="conversationMessage" class="message" role="status"></p>
          <div id="messageList" class="message-list" aria-live="polite"></div>

          <section id="branchSelector" class="branch-selector" aria-labelledby="branchSelectorTitle" hidden>
            <div class="section-heading">
              <h2 id="branchSelectorTitle">其他版本</h2>
              <button id="closeBranchSelector" type="button" class="secondary-button">Close</button>
            </div>
            <div id="branchOptions" class="branch-options"></div>
          </section>

          <section class="conversation-progress" aria-labelledby="conversationProgressTitle">
            <h2 id="conversationProgressTitle">Progress</h2>
            <div id="conversationEvents" class="conversation-events"></div>
          </section>

          <form id="messageComposer" class="message-composer">
            <label for="conversationQuestion">Follow-up question</label>
            <textarea
              id="conversationQuestion"
              name="conversationQuestion"
              rows="4"
              placeholder="Ask about the selected paper or compare it with another paper."
              required
            ></textarea>
            <div class="composer-actions">
              <label for="conversationDepth">Depth</label>
              <select id="conversationDepth" name="conversationDepth">
                <option value="quick">Quick</option>
                <option value="standard" selected>Standard</option>
                <option value="deep">Deep</option>
              </select>
              <button id="sendConversationMessage" type="submit">Send</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
